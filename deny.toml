# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Fail on security advisories for crates in the dependency graph.
ignore = [
    # `zvariant`, `zbus_names` and `zvariant_derive` unmaintained (the zbus family was merged
    # into zbus 6.x). Pulled only transitively via eframe -> egui-winit -> accesskit_unix ->
    # atspi -> zbus 5.x (GUI/inspector path), never by the published `vst3-host` library.
    # "Unmaintained" is an informational advisory, not a vulnerability; nothing to upgrade to
    # until atspi/accesskit move to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # `ttf-parser` unmaintained. Pulled only through egui's text stack (GUI/dev path), never by
    # the published `vst3-host` library. "Unmaintained" is an informational advisory, not a
    # vulnerability; nothing to upgrade to until egui migrates off it.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
# vst3-host is MIT; allow the common permissive licenses its dependency graph uses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    # coremidi's -sys crate (live MIDI input on macOS) is public-domain Unlicense.
    "Unlicense",
    # egui bundles default fonts under these font licenses.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
# The graph carries a few duplicate transitive versions; surface but don't fail on them.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
